# Render blueprint: backend as a Docker web service (free tier).
# Set GROQ_API_KEY in the Render dashboard (never commit it). Update HS_CORS_ORIGINS to the Vercel URL.
services:
  - type: web
    name: hydrosentinel-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      # Set this to the exact origin Vercel gives you, scheme included, no trailing slash.
      # Do not guess the subdomain: hydro-sentinel.vercel.app belongs to an unrelated project, and
      # a wrong value here fails as "Cannot reach the API" rather than as a CORS error.
      - key: HS_CORS_ORIGINS
        sync: false
      # Live extraction cache lives on the ephemeral disk; rebuilt after each spin-down.
      - key: HS_LIVE_CACHE
        value: /app/data/live_cache
